[project]
name = "hardsid4u"
version = "1.0.0"
description = "Talk to a HardSID 4U over libusb from macOS and Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["libusb1>=3.0"]

[project.urls]
Homepage = "https://github.com/USERNAME/hardsid4u"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardsid4u"]
